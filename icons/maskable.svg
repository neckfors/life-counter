<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- icon.svg for Android adaptive icons: launchers crop the edges (by different amounts), so
       the content is scaled to fit even the tightest crop while keeping the spacing of icon.svg. -->
