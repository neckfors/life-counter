       transform="translate(-108 -70)">
      <path d="M 2 46 A 45 45 0 0 1 92 46 C 92 78 62 98 2 140 L 94 140"/>
      <rect x="124" y="0" width="92" height="140" rx="46"/>
    </g>
  </defs>
  <rect x="0" y="0" width="512" height="256" fill="#5d9451"/>
  <rect x="0" y="256" width="512" height="256" fill="#2980b9"/>
  <rect x="0" y="250" width="512" height="12" fill="#111"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <use href="#twenty" transform="translate(256 125) rotate(180) scale(0.88)"/>
    <use href="#twenty" transform="translate(256 387) scale(0.88)"/>
    <circle cx="256" cy="256" r="30" fill="#111" stroke="#fff" stroke-width="5.5"/>
    <path d="M 242 247 H 270 M 242 256 H 270 M 242 265 H 270" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
